<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsi Komputasi Awan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0db7ed, #384d54);
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px 50px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 2.2rem; margin-bottom: 10px; }
    p { margin-bottom: 20px; }
    .badge {
      display: inline-block;
      background: #fff;
      color: #0db7ed;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Praktikum Komputasi Awan</h1>
    <p>Dibuat oleh Fauziah | Berjalan di dalam Docker Container</p>
    <span class="badge">GitHub → Docker Hub</span>
  </div>
</body>
</html>
